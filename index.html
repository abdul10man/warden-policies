<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden — Policies</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #e8eefc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        .card {
            background: #121a2d;
            border: 1px solid #243454;
            border-radius: 20px;
            padding: 45px 30px;
        }

        h1 {
            color: #4da3ff;
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            color: #aebbd1;
            font-size: 18px;
        }

        .links {
            margin-top: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 14px 22px;
            border-radius: 10px;
            background: #1769aa;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #2185d0;
        }

        .footer {
            margin-top: 25px;
            color: #71809b;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Warden</h1>

            <p>
                Security, moderation, automation and community management

            </p>

            <div class="links">
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>

            <div class="footer">
                © 2026 Warden. All rights reserved.
            </div>

</html>
